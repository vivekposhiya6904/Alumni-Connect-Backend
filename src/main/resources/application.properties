spring.application.name=alumni-management

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alumni_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MongoDB Configuration for Chat Storage
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/alumni_chat_db}}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/alumni_chat_db}}
spring.data.mongodb.database=${MONGODB_DATABASE:alumni_chat_db}
spring.data.mongodb.auto-index-creation=true

# JWT Authentication (30-day mobile expiration default)
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJwtGeneration123456}
jwt.expiration.ms=${JWT_EXPIRATION_MS:2592000000}

# File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Serve static files from uploads directory
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.web.resources.static-locations=file:${app.upload.dir}/,classpath:/static/
server.address=0.0.0.0

# Mail Configuration (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:globelv79@gmail.com}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:your_app_password}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://192.168.*}

# Centralized local configuration import (.env and optional legacy application-local.properties)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:./application-local.properties,optional:file:../application-local.properties


