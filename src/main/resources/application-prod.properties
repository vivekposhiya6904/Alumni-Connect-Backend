# =====================================================================
# GLS-CONNECT PRODUCTION RUNTIME CONFIGURATION (Render / Cloud)
# =====================================================================

# Server Port and Interface Binding
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL Database Configuration (Render Internal Private Network)
# Must be set via Render Environment Variables - no silent localhost fallback
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling & Resilience (HikariCP)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Safe Schema Management (Preserves existing records; only applies additive updates)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# MongoDB Configuration for Chat Storage (MongoDB Atlas)
# Must be set via Render Environment Variables - no silent localhost fallback
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:alumni_chat_db}
spring.data.mongodb.auto-index-creation=true

# JWT Authentication
# Must be supplied via JWT_SECRET environment variable (min 256-bit / 32 bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:2592000000}

# Mail Configuration (SMTP for Account Verification & Password Reset)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# File Upload Settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.web.resources.static-locations=file:${APP_UPLOAD_DIR:uploads}/,classpath:/static/

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}
